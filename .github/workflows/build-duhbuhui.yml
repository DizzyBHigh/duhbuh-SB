name: Build duhBuhUI

on:
  push:
    paths:
      - 'src/duhBuhUI/**'
      - '.github/workflows/build-duhbuhui.yml'
  pull_request:
    paths:
      - 'src/duhBuhUI/**'
      - '.github/workflows/build-duhbuhui.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build duhBuhUI
        run: msbuild src/duhBuhUI/duhBuhUI.csproj /restore /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: duhBuhUI
          path: 'src/duhBuhUI/bin/Any CPU/Release/net48/duhBuhUI.dll'
          if-no-files-found: error
