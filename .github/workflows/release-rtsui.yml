name: Release RtsUI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build RtsUI
        run: msbuild src/RtsUI/RtsUI.csproj /restore /p:Configuration=Release /p:Platform="Any CPU"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "src/RtsUI/bin/Any CPU/Release/net48/RtsUI.dll" `
            --title "RtsUI ${{ github.ref_name }}" `
            --generate-notes