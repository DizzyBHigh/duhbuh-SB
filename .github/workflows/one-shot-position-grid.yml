name: one-shot-position-grid

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Implement 3x3 position radio grid'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch shared UI
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/duhBuhUI/DuhBuhUI.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('using System.Windows.Controls;\n', 'using System.Windows.Controls;\nusing System.Windows.Controls.Primitives;\n', 1)
          old_radio = '''else if (d.Type == "radio") { StackPanel box = FieldBox(theme, d.Description); box.Children.Insert(0, new TextBlock { Text = d.Title, FontSize = 14, Foreground = ThemeBrush(theme, "PrimaryText") }); StackPanel group = new StackPanel { Margin = new Thickness(0, 5, 0, 0), Tag = d.Key }; string current = Read(d.Key, (string)d.DefaultValue); for (int j = 0; j < d.Options.Length; j++) group.Children.Add(new RadioButton { Content = d.Options[j], IsChecked = string.Equals(current, d.Options[j], StringComparison.Ordinal), GroupName = d.Key, Margin = new Thickness(0, 2, 0, 2) }); box.Children.Insert(1, group); panel.Children.Add(box); }'''
          new_radio = '''else if (d.Type == "radio") { StackPanel box = FieldBox(theme, d.Description); box.Children.Insert(0, new TextBlock { Text = d.Title, FontSize = 14, Foreground = ThemeBrush(theme, "PrimaryText") }); string current = Read(d.Key, (string)d.DefaultValue); if (d.Key == "duhbuh_overlay_lurks_position" && d.Options.Length == 9) { UniformGrid group = new UniformGrid { Columns = 3, Rows = 3, Margin = new Thickness(0, 5, 0, 0), Tag = d.Key }; for (int j = 0; j < d.Options.Length; j++) group.Children.Add(new RadioButton { Content = d.Options[j], IsChecked = string.Equals(current, d.Options[j], StringComparison.Ordinal), GroupName = d.Key, Margin = new Thickness(4, 3, 12, 3), HorizontalAlignment = HorizontalAlignment.Left }); box.Children.Insert(1, group); } else { StackPanel group = new StackPanel { Margin = new Thickness(0, 5, 0, 0), Tag = d.Key }; for (int j = 0; j < d.Options.Length; j++) group.Children.Add(new RadioButton { Content = d.Options[j], IsChecked = string.Equals(current, d.Options[j], StringComparison.Ordinal), GroupName = d.Key, Margin = new Thickness(0, 2, 0, 2) }); box.Children.Insert(1, group); } panel.Children.Add(box); }'''
          if old_radio not in text:
              raise SystemExit('radio block not found')
          text = text.replace(old_radio, new_radio, 1)
          old_save = '''StackPanel group = fe as StackPanel; if (group != null && group.Tag != null) for (int i = 0; i < group.Children.Count; i++) { RadioButton radio = group.Children[i] as RadioButton; if (radio != null && radio.IsChecked == true) _setGlobal(key, radio.Content == null ? "" : radio.Content.ToString(), true); } DatePicker date = fe as DatePicker;'''
          new_save = '''StackPanel group = fe as StackPanel; if (group != null && group.Tag != null) for (int i = 0; i < group.Children.Count; i++) { RadioButton radio = group.Children[i] as RadioButton; if (radio != null && radio.IsChecked == true) _setGlobal(key, radio.Content == null ? "" : radio.Content.ToString(), true); } UniformGrid uniformGroup = fe as UniformGrid; if (uniformGroup != null && uniformGroup.Tag != null) for (int i = 0; i < uniformGroup.Children.Count; i++) { RadioButton radio = uniformGroup.Children[i] as RadioButton; if (radio != null && radio.IsChecked == true) _setGlobal(key, radio.Content == null ? "" : radio.Content.ToString(), true); } DatePicker date = fe as DatePicker;'''
          if old_save not in text:
              raise SystemExit('save radio block not found')
          text = text.replace(old_save, new_save, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-position-grid.yml
          git add src/duhBuhUI/DuhBuhUI.cs .github/workflows/one-shot-position-grid.yml
          git commit -m "Implement 3x3 position radio grid"
          git push
